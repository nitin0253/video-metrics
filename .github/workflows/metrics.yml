name: video-delivery-metrics

on:
  schedule:
    # Every 6h, aligned to 06:00 IST. IST = UTC+5:30.
    # 06:00, 12:00, 18:00, 00:00 IST  ->  00:30, 06:30, 12:30, 18:30 UTC
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: video-metrics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build metrics and populate sheet
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python src/build_metrics.py
